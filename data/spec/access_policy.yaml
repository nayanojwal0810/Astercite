default_access: deny

admin_role: document_admin
admin_permissions:
  - upload
  - revise
  - archive
  - delete
  - change_access_rules

rules:
  default_rule: "Explicit read permissions required. Default deny."
  admin_rule: "document_admin manages documents but does not automatically grant read access to restricted content."
  cross_document_rule: "Cross-document references do not grant read access to referenced documents."
  team_lead_scope_rule: "team_lead role requires matching team_lead_departments for department and restricted documents."

